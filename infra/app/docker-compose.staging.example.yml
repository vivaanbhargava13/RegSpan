name: regspan-staging

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: regspan-app:staging
    env_file:
      - ${REGSPAN_ENV_FILE:-.env.staging.example}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_MANUAL_SIG_HANDLE: "true"
      REGSPAN_SHUTDOWN_GRACE_MS: "${REGSPAN_SHUTDOWN_GRACE_MS:-330000}"
    ports:
      - "127.0.0.1:${REGSPAN_BIND_PORT:-3000}:3000"
    restart: on-failure:5
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
      - /app/.next/cache:size=128m,uid=10001,gid=10001,nosuid,nodev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 360s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
